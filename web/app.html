<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>길찾기 · 처음 가는 길 미리 보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<div id="mapwrap"><div id="map" aria-label="지도"></div></div>

<aside id="panel" aria-label="길찾기 패널">
  <button id="grab" class="grab" aria-label="패널 높이 바꾸기"><span></span></button>

  <header class="phead">
    <div class="brand">
      <h1>길찾기</h1>
      <button id="collapse" class="icon-btn" aria-label="패널 접기" title="패널 접기">«</button>
    </div>

    <button id="tripsum" class="tripsum" aria-label="출발지·도착지 수정"></button>

    <div class="inputs" id="inputs">
      <div class="field" id="f-origin">
        <i class="dot o" aria-hidden="true"></i>
        <input id="q-origin" aria-label="출발지" placeholder="출발지 검색" autocomplete="off">
        <button class="clr" data-clear="origin" aria-label="출발지 지우기" hidden>✕</button>
      </div>
      <div class="field wp" id="f-wp0" hidden>
        <i class="dot w" aria-hidden="true"><b>1</b></i>
        <input id="q-wp0" aria-label="경유지 1" placeholder="경유지 1 검색" autocomplete="off">
        <button class="clr show" data-viadel="0" aria-label="경유지 1 삭제">✕</button>
      </div>
      <div class="field wp" id="f-wp1" hidden>
        <i class="dot w" aria-hidden="true"><b>2</b></i>
        <input id="q-wp1" aria-label="경유지 2" placeholder="경유지 2 검색" autocomplete="off">
        <button class="clr show" data-viadel="1" aria-label="경유지 2 삭제">✕</button>
      </div>
      <div class="field wp" id="f-wp2" hidden>
        <i class="dot w" aria-hidden="true"><b>3</b></i>
        <input id="q-wp2" aria-label="경유지 3" placeholder="경유지 3 검색" autocomplete="off">
        <button class="clr show" data-viadel="2" aria-label="경유지 3 삭제">✕</button>
      </div>
      <div class="field" id="f-goal">
        <i class="dot g" aria-hidden="true"></i>
        <input id="q-goal" aria-label="도착지" placeholder="도착지 검색" autocomplete="off">
        <button class="clr" data-clear="goal" aria-label="도착지 지우기" hidden>✕</button>
      </div>
      <ul id="sg-origin" class="suggest" hidden></ul>
      <ul id="sg-wp0" class="suggest" hidden></ul>
      <ul id="sg-wp1" class="suggest" hidden></ul>
      <ul id="sg-wp2" class="suggest" hidden></ul>
      <ul id="sg-goal" class="suggest" hidden></ul>
    </div>
    <div class="subactions">
      <button id="swap" class="link">⇅ 출발·도착 바꾸기</button>
      <button id="viaadd" class="link">＋ 경유지 <span id="viacnt" class="muted"></span></button>
    </div>
  </header>

  <div class="pbody" id="pbody">
    <div id="v-list" class="view"></div>
    <div id="v-detail" class="view" hidden></div>
    <div id="v-compare" class="view" hidden></div>
  </div>
</aside>

<button id="expand" class="expand" hidden aria-label="패널 펼치기">» 길찾기</button>

<div class="mapctl" role="toolbar" aria-label="지도 도구">
  <button id="traffic" aria-pressed="false" title="실시간 도로 교통량 표시">🚦<span>교통량</span></button>
  <button id="legendbtn" popovertarget="legend" title="색 설명">ⓘ<span>범례</span></button>
  <button id="fitall" hidden title="전체 경로 보기">⤢<span>전체</span></button>
</div>

<div id="legend" popover>
  <h2>지도 색 설명</h2>
  <ul>
    <li><i style="background:#04c75b"></i>원활</li>
    <li><i style="background:#ffa000"></i>서행</li>
    <li><i style="background:#ee3f3f"></i>혼잡</li>
    <li><i style="background:#8b95a1"></i>교통정보 없음</li>
    <li><i style="background:#b6bec8"></i>다른 경로</li>
  </ul>
  <ul>
    <li><span class="hzi tri acc"><svg viewBox="0 0 24 22"><path d="M12 1.5 23 20.5H1z" fill="currentColor"/><rect x="10.9" y="7.5" width="2.2" height="6.5" rx="1" fill="#fff"/><circle cx="12" cy="16.6" r="1.3" fill="#fff"/></svg></span>사고가 반복된 지점</li>
    <li><span class="hzi tri ice"><svg viewBox="0 0 24 22"><path d="M12 1.5 23 20.5H1z" fill="currentColor"/><text x="12" y="17.5" text-anchor="middle" font-size="10" fill="#fff">❄</text></svg></span>결빙 사고 지점</li>
    <li><span class="hzi cam"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm8 2.5A3.8 3.8 0 1 0 12 17a3.8 3.8 0 0 0 0-7.5z"/></svg></span>과속 단속카메라</li>
    <li><span class="hzi zone">30</span>어린이·노인 보호구역 (제한속도)</li>
  </ul>
  <p>위험 지점은 경로 비교를 열면 표시돼요. 카메라·보호구역은 지도를 확대해야 보여요.</p>
  <button class="btn small" popovertarget="legend" popovertargetaction="hide">닫기</button>
</div>

<div id="toast" role="alert" hidden></div>
<div id="status" class="sr" aria-live="polite"></div>

<!-- 로드뷰(거리뷰)는 maps-panorama.js 서브모듈로 따로 내려온다 -->
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=__NCP_KEY_ID__&submodules=panorama"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
